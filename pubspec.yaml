name: digipoly
description: "A digital monopoly banking."
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: ^3.11.3

dependencies:
  archive: ^4.0.9
  bonsoir: ^7.1.4
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  intl: ^0.20.3
  mobile_scanner: ^7.2.1
  network_info_plus: ^8.2.0
  nfc_manager: ^4.1.1
  path: ^1.9.1
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.5
  shelf: ^1.4.2
  shelf_web_socket: ^3.0.0
  sqflite: ^2.4.2+1
  sqflite_common_ffi: ^2.4.0+3
  sqflite_common_ffi_web: ^1.1.1
  uuid: ^4.5.3
  web_socket: ^1.0.1
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    # Optional: the web build zipped by tool/bundle_web_app, served by the
    # game server so browsers can join by scanning the room QR.
    - assets/web/

# Regenerate after changing assets/icon/*: `dart run flutter_launcher_icons`
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  ios: false
  adaptive_icon_background: "#635BFF"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#635BFF"
    theme_color: "#635BFF"

# Regenerate after changing assets/icon/*: `dart run flutter_native_splash:create`
# Android 12+ ignores the plain color/image above and uses the android_12
# section instead (a different, OS-level splash API).
flutter_native_splash:
  color: "#635BFF"
  image: assets/icon/icon_foreground.png
  color_dark: "#0B0D14"
  image_dark: assets/icon/icon_foreground.png
  android_12:
    image: assets/icon/icon_foreground.png
    icon_background_color: "#635BFF"
    image_dark: assets/icon/icon_foreground.png
    icon_background_color_dark: "#0B0D14"
  android: true
  ios: false
  web: false
