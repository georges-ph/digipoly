name: digipoly
description: "A digital monopoly banking."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.3

dependencies:
  archive: ^4.0.9
  bonsoir: ^7.1.4
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  intl: ^0.20.3
  mobile_scanner: ^7.2.1
  network_info_plus: ^8.2.0
  nfc_manager: ^4.1.1
  path: ^1.9.1
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.5
  shelf: ^1.4.2
  shelf_web_socket: ^3.0.0
  sqflite: ^2.4.2+1
  sqflite_common_ffi: ^2.4.0+3
  sqflite_common_ffi_web: ^1.1.1
  uuid: ^4.5.3
  web_socket: ^1.0.1
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # Optional: the web build zipped by tool/bundle_web_app, served by the
    # game server so browsers can join by scanning the room QR.
    - assets/web/
