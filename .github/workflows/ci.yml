name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the version actually used for local dev — `channel:
          # stable` floats forward over time and can fail CI on a newly
          # deprecated API with no code change on our side. Bump
          # deliberately when upgrading Flutter locally.
          flutter-version: 3.41.5
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test
